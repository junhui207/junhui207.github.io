<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Attack</title>
<style>
body {
  margin: 0;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { color: #39ff14; text-shadow: 0 0 12px #39ff14; }
#score { color: #39ff14; font-size: 24px; }
canvas {
  background: #080d12;
  border: 3px solid #39ff14;
  max-width: 90vw;
  height: auto;
}
button {
  background: #39ff14;
  color: #101820;
  border: none;
  border-radius: 8px;
  padding: 12px 20px;
  margin: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>
<h1>🐍 SNAKE ATTACK</h1>
<p>Score: <span id="score">0</span></p>
<canvas id="board" width="400" height="400"></canvas>
<br>
<button id="start">START GAME</button>
<p id="message">Press Start to play!</p>
<p>Use arrow keys or WASD to move.</p>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const scoreDisplay = document.getElementById("score");
const message = document.getElementById("message");
const cell = 20;
const total = 20;

let snake, food, dx, dy, score, playing, timer;

function newFood() {
  let f;
  do {
    f = {
      x: Math.floor(Math.random() * total),
      y: Math.floor(Math.random() * total)
    };
  } while (snake.some(s => s.x === f.x && s.y === f.y));
  return f;
}

function startGame() {
  clearInterval(timer);
  snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
  ];
  dx = 1;
  dy = 0;
  score = 0;
  playing = true;
  scoreDisplay.textContent = score;
  message.textContent = "Eat the red food!";
  food = newFood();
  draw();
  timer = setInterval(step, 300);
}

function draw() {
  ctx.fillStyle = "#080d12";
  ctx.fillRect(0, 0, 400, 400);

  ctx.strokeStyle = "#17272c";
  for (let i = 0; i <= 400; i += cell) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, 400);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(400, i);
    ctx.stroke();
  }

  ctx.fillStyle = "#ff355e";
  ctx.shadowColor = "#ff355e";
  ctx.shadowBlur = 12;
  ctx.fillRect(food.x * cell + 3, food.y * cell + 3, 14, 14);
  ctx.shadowBlur = 0;

  snake.forEach((part, i) => {
    ctx.fillStyle = i === 0 ? "#b6ff00" : "#39ff14";
    ctx.shadowColor = "#39ff14";
    ctx.shadowBlur = i === 0 ? 12 : 4;
    ctx.fillRect(part.x * cell + 1, part.y * cell + 1, 18, 18);
  });
  ctx.shadowBlur = 0;
}

function step() {
  const head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };

  const eating = head.x === food.x && head.y === food.y;

  if (
    head.x < 0 || head.x >= total ||
    head.y < 0 || head.y >= total ||
    snake.slice(0, eating ? undefined : -1)
      .some(p => p.x === head.x && p.y === head.y)
  ) {
    playing = false;
    clearInterval(timer);
    message.textContent = "Game Over! Your score: " + score;
    return;
  }

  snake.unshift(head);

  if (eating) {
    score += 10;
    scoreDisplay.textContent = score;
    food = newFood();
  } else {
    snake.pop();
  }

  draw();
}

document.addEventListener("keydown", function(e) {
  const k = e.key.toLowerCase();

  if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].includes(k)) {
    e.preventDefault();
  }

  if ((k === "arrowup" || k === "w") && dy !== 1) {
    dx = 0; dy = -1;
  } else if ((k === "arrowdown" || k === "s") && dy !== -1) {
    dx = 0; dy = 1;
  } else if ((k === "arrowleft" || k === "a") && dx !== 1) {
    dx = -1; dy = 0;
  } else if ((k === "arrowright" || k === "d") && dx !== -1) {
    dx = 1; dy = 0;
  }
});

document.getElementById("start").addEventListener("click", startGame);

snake = [{x: 10, y: 10}];
food = {x: 14, y: 10};
dx = 0;
dy = 0;
draw();
</script>
</body>
</html>
